name: Sync Kumo updates

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-kumo-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update repository
        uses: actions/checkout@v4

      - name: Download and validate latest Kumo release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/sofare-ec/Kumo/releases/latest' `
            -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'Kumo-update-sync' }
          $version = ([string]$release.tag_name).TrimStart('v')
          if ($version -notmatch '^\d+\.\d+$') { throw "无效的 Kumo 版本：$version" }

          $download = Join-Path $env:RUNNER_TEMP 'kumo-release'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          $required = @(
            "Kumo-$version-Setup.zip",
            "Kumo-$version-Setup.zip.sha256",
            'update.json'
          )
          $assets = @($release.assets)
          foreach ($name in $required) {
            $asset = $assets | Where-Object name -EQ $name | Select-Object -First 1
            if (-not $asset) { throw "Kumo Release 缺少必需文件：$name" }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile (Join-Path $download $name)
          }
          foreach ($asset in ($assets | Where-Object name -Match "^Kumo-\d+\.\d+-to-$([regex]::Escape($version))-Delta\.zip(\.sha256)?$")) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile (Join-Path $download $asset.name)
          }

          $manifest = Get-Content -LiteralPath (Join-Path $download 'update.json') -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $version) { throw '清单版本与 Release 标签不一致。' }
          $setup = Join-Path $download "Kumo-$version-Setup.zip"
          $expected = ((Get-Content -LiteralPath "$setup.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if (-not $actual.Equals($expected, [StringComparison]::OrdinalIgnoreCase)) { throw '完整包 SHA-256 校验失败。' }

          $releaseTarget = Join-Path $PWD "Kumo/releases/$version"
          New-Item -ItemType Directory -Path $releaseTarget -Force | Out-Null
          Get-ChildItem -LiteralPath $download -File | Where-Object Name -NE 'update.json' |
            Copy-Item -Destination $releaseTarget -Force
          Copy-Item -LiteralPath (Join-Path $download 'update.json') -Destination 'Kumo/update.json' -Force

      - name: Commit only the Kumo update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- Kumo
          $changed = @(git diff --cached --name-only)
          $unsafe = @($changed | Where-Object { $_ -notmatch '^Kumo/' })
          if ($unsafe.Count -gt 0) { throw "拒绝提交 Kumo 目录以外的文件：$($unsafe -join ', ')" }
          if ($changed.Count -eq 0) { Write-Host 'Kumo 更新通道已经是最新版本。'; exit 0 }
          $version = (Get-Content -LiteralPath 'Kumo/update.json' -Raw | ConvertFrom-Json).version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: publish Kumo $version update"
          git push
